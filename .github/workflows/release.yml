name: Release database version

# Pushing a tag vX.Y.Z publishes a GitHub Release with the versioned bundle and settings tables.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate (also checks that the tag matches data/meta.json)
        run: python literature_web/scripts/validate.py
      - name: Build bundle
        run: python literature_web/scripts/build_release.py dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*_settings.csv dist/*_settings.json \
            --title "TUS Tissue Properties $GITHUB_REF_NAME" --notes-file dist/release_notes.md --verify-tag
