name: Validate data

on:
  pull_request:
    paths: ["literature_web/data/**", "literature_web/scripts/validate.py"]
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["literature_web/data/**", "literature_web/scripts/validate.py"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate CSVs against data/schema.json
        run: python literature_web/scripts/validate.py
